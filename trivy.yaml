# Trivy Configuration File
# Documentation: https://aquasecurity.github.io/trivy/latest/docs/references/configuration/config-file/

exit-code: 1
severity:
  - HIGH
  - CRITICAL

vuln-type:
  - os
  - library

ignore-unfixed: true
ignorefile: .trivyignore

format: table

scan:
  scanners:
    - vuln
    - misconfig
    - secret
