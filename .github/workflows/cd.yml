name: CD / Deploy to EKS (OIDC)

on:
  workflow_run:
    workflows: ["CI / Security / Smoke Tests"]
    types: [completed]
    branches: ["master", "main"]
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  id-token: write   # Required for GitHub OIDC token
  contents: read

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: interview-eks-cluster
  IMAGE_NAME: mariborges22/infrastructure-interview-app

jobs:
  deploy:
    name: Deploy to EKS via Helm
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      # Gracefully detect whether an actual AWS Account / Role is wired
      - name: Check AWS Credentials Availability
        id: check-aws
        run: |
          if [ -z "${{ secrets.AWS_ROLE_ARN }}" ]; then
            echo "::notice title=Cloud Deployment Notice::AWS_ROLE_ARN secret not configured. Skipping live EKS deployment."
            echo "::notice ::Validating production Helm chart templates with values-production.yaml..."
            echo "configured=false" >> $GITHUB_OUTPUT
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      # If no AWS credentials exist (test/interview environment), perform dry-run template lint
      - name: Validate Production Helm Manifests (Dry-run)
        if: steps.check-aws.outputs.configured == 'false'
        run: |
          helm template interview-app ./helm/infrastructure-interview-app \
            -f ./helm/infrastructure-interview-app/values-production.yaml \
            --set image.tag=${{ github.sha }} > /dev/null
          echo "Production Helm manifests are valid and ready for EKS deployment!"

      # Passwordless authentication via OIDC Federation (only runs when AWS_ROLE_ARN secret is configured)
      - name: Configure AWS Credentials via OIDC
        if: steps.check-aws.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: steps.check-aws.outputs.configured == 'true'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        if: steps.check-aws.outputs.configured == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and Push to ECR
        if: steps.check-aws.outputs.configured == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update kubeconfig for EKS
        if: steps.check-aws.outputs.configured == 'true'
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.EKS_CLUSTER_NAME }} \
            --region ${{ env.AWS_REGION }}

      - name: Deploy via Helm
        if: steps.check-aws.outputs.configured == 'true'
        run: |
          helm upgrade --install interview-app ./helm/infrastructure-interview-app \
            -f ./helm/infrastructure-interview-app/values-production.yaml \
            --set image.repository=${{ steps.login-ecr.outputs.registry }}/${{ env.IMAGE_NAME }} \
            --set image.tag=${{ github.sha }} \
            --set image.pullPolicy=Always \
            --wait --timeout 300s

      - name: Verify Deployment Rollout
        if: steps.check-aws.outputs.configured == 'true'
        run: |
          kubectl rollout status deployment/interview-app-infrastructure-interview-app --timeout=180s

      - name: Run Smoke Tests against EKS
        if: steps.check-aws.outputs.configured == 'true'
        run: |
          INGRESS_URL=$(kubectl get ingress interview-app-infrastructure-interview-app -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          echo "Ingress URL: ${INGRESS_URL}"
          sleep 10
          APP_URL="http://${INGRESS_URL}" node tests/smoke-test.js
