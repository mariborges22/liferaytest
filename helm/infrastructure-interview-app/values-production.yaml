# Production overrides
# Usage: helm upgrade --install interview-app ./helm/infrastructure-interview-app -f helm/infrastructure-interview-app/values-production.yaml

image:
  pullPolicy: Always

# Strict zone distribution in production
topologySpreadConstraints:
  enabled: true
  maxSkew: 1
  topologyKey: "topology.kubernetes.io/zone"
  whenUnsatisfiable: "DoNotSchedule"

# Production database (RDS or equivalent)
database:
  host: "prod-db.cluster-xxxxx.us-east-1.rds.amazonaws.com"
  port: 3306
  name: "app_prod"
  synchronize: "false"  # NEVER auto-sync schema in production
  existingSecret: "db-credentials-secret"  # Managed by External Secrets Operator

# Production-grade resources
resources:
  limits:
    cpu: "1"
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

# Production autoscaling
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 12
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 75

# Strict PDB for production
podDisruptionBudget:
  enabled: true
  minAvailable: 2

# ServiceAccount with IRSA for AWS Secrets Manager access
serviceAccount:
  create: true
  annotations:
    eks.amazonaws.com/role-arn: "" # Set to Terraform output: app_secrets_role_arn

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "15"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: "api.example.com"
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: api-tls-cert
      hosts:
        - "api.example.com"
