{{- /*
================================================================================
PRODUCTION SECRET MANAGEMENT BEST PRACTICE EXAMPLE: EXTERNAL SECRETS OPERATOR
================================================================================
In enterprise GitOps setups (AWS EKS, Vault, etc.), NEVER store real passwords
in Git repositories or Helm values files.

Instead, use External Secrets Operator (https://external-secrets.io/) to pull
credentials dynamically from AWS Secrets Manager or HashiCorp Vault.

To activate, set `database.existingSecret: "db-credentials-secret"` in values.yaml
and enable the ExternalSecret below.
*/ -}}
{{- if .Values.database.existingSecret }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.database.existingSecret }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager # Or vault-backend
    kind: ClusterSecretStore
  target:
    name: {{ .Values.database.existingSecret }}
    creationPolicy: Owner
  data:
    - secretKey: DB_USER
      remoteRef:
        key: production/database/credentials
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: production/database/credentials
        property: password
{{- end }}
