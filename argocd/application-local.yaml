apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infrastructure-interview-app-local
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/mariborges22/liferaytest.git
    targetRevision: master
    path: helm/infrastructure-interview-app
    helm:
      valueFiles:
        - values-local.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
